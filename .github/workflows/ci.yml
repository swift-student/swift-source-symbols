name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / Swift 6.0
            xcode: '16.2'
            swift: '6.0'
            runner: macos-15
          - name: macOS / Swift 6.2
            xcode: '26.2'
            swift: '6.2'
            runner: macos-15
          - name: macOS / Swift 6.4 (Tart)
            xcode: '27-beta-6'
            swift: '6.4'
            runner: [self-hosted, macOS, ARM64, tart-ci-dedicated, tart-xcode27]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          mkdir -p .cache/ci
          xcodebuild -version | tee .cache/ci/toolchain.log
          swift --version | tee -a .cache/ci/toolchain.log
          swift --version | grep -F 'Apple Swift version ${{ matrix.swift }}.'
      - name: Cache pinned tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tools/ci
          key: tools-v1-${{ runner.os }}-${{ runner.arch }}-xcode-${{ matrix.xcode }}-${{ hashFiles('Makefile', 'scripts/ci/install-tools.sh', 'Package.swift', 'Package.resolved') }}
      - name: Install pinned tools
        run: |
          bash scripts/ci/install-tools.sh 2>&1 | tee .cache/ci/tools.log
          echo "$GITHUB_WORKSPACE/.tools/ci/bin" >> "$GITHUB_PATH"
      - name: Build, test, lint, format, and example
        run: make -k check 2>&1 | tee .cache/ci/check.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-xcode-${{ matrix.xcode }}
          path: .cache/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
